name: Generate Retro GitHub Stats

on:
    schedule:
        - cron: "0 0 * * *" # daily at midnight UTC
    workflow_dispatch: {}
    push:
        branches: [master]
        paths:
            - "generate_stats.py"

jobs:
    generate-stats:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Generate retro stats SVG
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  GH_USERNAME: CodewithSegNet
              run: python3 generate_stats.py

            - name: Commit changes
              run: |
                  git config --global user.name "segunWakaTime"
                  git config --global user.email "commits@emmanuel.ru"
                  git add github-stats.svg
                  git diff --cached --quiet || git commit -m "chore (README): update retro stats"
                  git pull --rebase
                  git push
