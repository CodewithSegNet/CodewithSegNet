<svg xmlns="http://www.w3.org/2000/svg" width="520" height="448" viewBox="0 0 520 448">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');

      .bg { fill: #0d1117; }
      .border { fill: none; stroke: #00ff41; stroke-width: 1.5; rx: 6; ry: 6; opacity: 0.5; }
      .inner-border { fill: none; stroke: #1a1a2e; stroke-width: 1; rx: 4; ry: 4; }

      .title {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 13px;
        fill: #00ff41;
      }
      .section-title {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 10px;
        fill: #00ff41;
        opacity: 0.8;
      }
      .stat-label {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 18px;
        fill: #7a7a8e;
      }
      .stat-value {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 22px;
        fill: #e6e6e6;
        font-weight: bold;
      }
      .streak-value {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 22px;
        fill: #ff6e40;
        font-weight: bold;
      }
      .lang-label {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 16px;
        fill: #b0b0c0;
      }
      .lang-pct {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 16px;
        fill: #7a7a8e;
      }
      .bar-bg {
        fill: #161b22;
        rx: 3;
        ry: 3;
      }
      .cursor {
        fill: #00ff41;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes scanmove {
        0% { transform: translateY(-448px); }
        100% { transform: translateY(448px); }
      }
      .scan {
        fill: rgba(255,255,255,0.02);
        animation: scanmove 6s linear infinite;
      }
    </style>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="520" height="448" rx="6" ry="6"/>
  <rect class="border" x="1" y="1" width="518" height="446"/>

  <!-- Scanline -->
  <rect class="scan" x="0" y="0" width="520" height="40" rx="6"/>


  <text class="title" x="20" y="36" filter="url(#glow)">&gt; CodewithSegNet@github $</text>
  <rect class="cursor" x="281" y="26" width="8" height="13" rx="1"/>

  <line x1="20" y1="50" x2="500" y2="50" stroke="#1a1a2e" stroke-width="1"/>
  <text class="stat-label" x="20" y="78">REPOS</text>
  <text class="stat-value" x="20" y="102">44</text>
  <text class="stat-label" x="116" y="78">STARS</text>
  <text class="stat-value" x="116" y="102">3</text>
  <text class="stat-label" x="212" y="78">FOLLOWERS</text>
  <text class="stat-value" x="212" y="102">202</text>
  <text class="stat-label" x="308" y="78">STREAK</text>
  <text class="streak-value" x="308" y="102">30d</text>
  <text class="stat-label" x="404" y="78">BEST</text>
  <text class="streak-value" x="404" y="102">30d</text>
  <line x1="20" y1="120" x2="500" y2="120" stroke="#1a1a2e" stroke-width="1"/>
  <text class="section-title" x="20" y="140" filter="url(#glow)">&gt; TOP_LANGUAGES</text>
  <text class="lang-label" x="20" y="178">JavaScript</text>
  <rect class="bar-bg" x="130" y="168" width="330" height="12"/>
  <rect x="130" y="168" width="232.8" height="12" fill="#00ff41" rx="3" ry="3" opacity="0.9"/>
  <rect x="130" y="168" width="232.8" height="12" fill="#00ff41" rx="3" ry="3" opacity="0.25" filter="url(#glow)"/>
  <text class="lang-pct" x="468" y="179">70.6%</text>
  <text class="lang-label" x="20" y="206">TypeScript</text>
  <rect class="bar-bg" x="130" y="196" width="330" height="12"/>
  <rect x="130" y="196" width="36.3" height="12" fill="#00d4ff" rx="3" ry="3" opacity="0.9"/>
  <rect x="130" y="196" width="36.3" height="12" fill="#00d4ff" rx="3" ry="3" opacity="0.25" filter="url(#glow)"/>
  <text class="lang-pct" x="468" y="207">11.0%</text>
  <text class="lang-label" x="20" y="234">Python</text>
  <rect class="bar-bg" x="130" y="224" width="330" height="12"/>
  <rect x="130" y="224" width="24.9" height="12" fill="#f1e05a" rx="3" ry="3" opacity="0.9"/>
  <rect x="130" y="224" width="24.9" height="12" fill="#f1e05a" rx="3" ry="3" opacity="0.25" filter="url(#glow)"/>
  <text class="lang-pct" x="468" y="235">7.5%</text>
  <text class="lang-label" x="20" y="262">CSS</text>
  <rect class="bar-bg" x="130" y="252" width="330" height="12"/>
  <rect x="130" y="252" width="14.9" height="12" fill="#ff40ff" rx="3" ry="3" opacity="0.9"/>
  <rect x="130" y="252" width="14.9" height="12" fill="#ff40ff" rx="3" ry="3" opacity="0.25" filter="url(#glow)"/>
  <text class="lang-pct" x="468" y="263">4.5%</text>
  <text class="lang-label" x="20" y="290">HTML</text>
  <rect class="bar-bg" x="130" y="280" width="330" height="12"/>
  <rect x="130" y="280" width="12.4" height="12" fill="#ff6e40" rx="3" ry="3" opacity="0.9"/>
  <rect x="130" y="280" width="12.4" height="12" fill="#ff6e40" rx="3" ry="3" opacity="0.25" filter="url(#glow)"/>
  <text class="lang-pct" x="468" y="291">3.8%</text>
  <text class="lang-label" x="20" y="318">C</text>
  <rect class="bar-bg" x="130" y="308" width="330" height="12"/>
  <rect x="130" y="308" width="8.6" height="12" fill="#ff4444" rx="3" ry="3" opacity="0.9"/>
  <rect x="130" y="308" width="8.6" height="12" fill="#ff4444" rx="3" ry="3" opacity="0.25" filter="url(#glow)"/>
  <text class="lang-pct" x="468" y="319">2.6%</text>

  <g opacity="0.2">
    <rect x="20" y="432" width="3" height="3" fill="#00ff41"/>
    <rect x="26" y="432" width="3" height="3" fill="#00ff41"/>
    <rect x="32" y="432" width="3" height="3" fill="#00ff41"/>
    <rect x="38" y="432" width="3" height="3" fill="#ff6e40"/>
    <rect x="44" y="432" width="3" height="3" fill="#ff6e40"/>
  </g>

</svg>